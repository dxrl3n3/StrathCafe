openapi: 3.0.0
info:
  title: Strathmore Cafeteria Ordering System API
  description: Online food and medical supply ordering platform.
  version: 1.1.0
servers:
  - url: /
paths:
  /cafeteria/menu:
    get:
      summary: Return available food and integrated medicine listings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'

  /cafeteria/orders:
    post:
      summary: Create a new student order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
                - items
              properties:
                studentId:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: std-8842
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - itemId
                      - itemType
                      - quantity
                    properties:
                      itemId:
                        type: string
                        minLength: 1
                        example: med-101
                      itemType:
                        type: string
                        enum: [food, medicine]
                        example: medicine
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100
                        example: 2
      responses:
        '201':
          description: Order created successfully
          headers:
            Location:
              description: Address of the new order
              schema:
                type: string
                example: /cafeteria/orders/ord-5002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation failed (missing field, wrong type, unusable value, or unknown/unavailable item)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cafeteria/orders/{id}:
    get:
      summary: Return order status by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: ord-5001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update order status (fulfill or cancel)
      description: The request body is validated before the order is looked up, so an invalid body gets 400 even if the order does not exist. Sending the same status twice leaves the same end state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: ord-5001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, fulfilled, cancelled]
                  example: fulfilled
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation failed (status missing, not a string, or not one of the allowed values)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cafeteria/students/{studentId}/orders:
    get:
      summary: Return order history for a specific student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            example: std-8842
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

components:
  schemas:
    MenuItem:
      type: object
      properties:
        itemId:
          type: string
          example: med-101
        itemType:
          type: string
          enum: [food, medicine]
        name:
          type: string
          example: Paracetamol 500mg (strip)
        price:
          type: integer
          example: 50
    OrderItem:
      type: object
      properties:
        itemId:
          type: string
          example: med-101
        itemType:
          type: string
          enum: [food, medicine]
        name:
          type: string
          example: Paracetamol 500mg (strip)
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: integer
          example: 50
    Order:
      type: object
      properties:
        id:
          type: string
          example: ord-5001
        studentId:
          type: string
          example: std-8842
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [pending, fulfilled, cancelled]
        total:
          type: integer
          example: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        message:
          type: string
          example: studentId and items are required
