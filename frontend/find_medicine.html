<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Medicine - Strathmore University</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="medicine">
    <div id="site-header"></div>

    <main class="container">
        <h2>Find Medicine</h2>
        <div id="message" class="msg-slot"></div>

        <form method="GET" action="find_medicine.html" class="toolbar">
            <label for="q">Medicine name</label>
            <input type="text" id="q" name="q" placeholder="e.g. Paracetamol" required>
            <button type="submit" class="submit-btn">Search</button>
        </form>

        <div id="results"></div>
    </main>

    <div id="site-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pharmacy.js"></script>
</body>
</html>
