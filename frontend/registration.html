<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Strathmore University</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="register">
    <div id="site-header"></div>

    <main class="registration-container">
        <form id="registration-form" class="registration-form">
            <h2>Create Your Account</h2>
            <div id="message" class="msg-slot"></div>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required maxlength="100" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a password (min 8 characters)" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" name="role" required>
                    <option value="">Select your role</option>
                    <option value="student">Student (Place food orders)</option>
                    <option value="admin">Administrator (Manage system settings)</option>
                    <option value="kitchen">Kitchen Staff (Process food orders)</option>
                </select>
                <div class="role-description">
                    <p><strong>Student:</strong> Place orders from university cafeterias and track orders</p>
                    <p><strong>Administrator:</strong> Manage menus, users, and system configurations</p>
                    <p><strong>Kitchen Staff:</strong> Receive and prepare food orders from students</p>
                </div>
            </div>

            <button type="submit" class="submit-btn">Register Now</button>

            <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </main>

    <div id="site-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
